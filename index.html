<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="FWdLnX8xbz7wc2924_f8Qt6PWoqj1wsv59X7UU9-O2k">

    <title>Pixel Gun 3D 9.3.2 Revival</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #121212;
            color: #ffffff;
        }

        h1 {
            color: #ffd700;
        }

        h2 {
            color: #ffd700;
            margin-top: 40px;
            font-size: 1.4rem;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ffd700;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        a:hover {
            background-color: #e6c200;
        }

        .status-box {
            margin-top: 20px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .online {
            color: #4cd137;
            font-weight: bold;
        }

        .offline {
            color: #e84118;
            font-weight: bold;
        }

        .maps-list {
            list-style: none;
            padding: 0;
            margin: 15px auto;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .maps-list li {
            background-color: #1e1e1e;
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: block;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <h1>Pixel Gun 3D 9.3.2 Revival</h1>

    <p>
        Welcome to the official multiplayer revival project
        for PG3D version 9.3.2.
    </p>

    <a href="https://github.com/revanba3434/Pixel-Revival-3D-9.3.2/releases">
        Download APK &amp; IPA Releases
    </a>

    <h2>Server Status</h2>
    <div class="status-box">
        <p>Server: <span id="serverStatus" class="online">Checking...</span></p>
        <p>Players Online: <strong id="playerCount">0</strong></p>
        <p style="margin-top: 15px; font-weight: bold;">Current Matches:</p>
        <ul id="matchesList" class="maps-list">
            <li style="color: #888;">No active matches right now</li>
        </ul>
    </div>

    <script>
        const API_URL = 'https://pixelgunserver123.pixely.cc.cd:8443/api/online';

        async function updateStats() {
            try {
                const res = await fetch(API_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();

                const statusEl = document.getElementById('serverStatus');
                statusEl.textContent = 'Online';
                statusEl.className = 'online';

                document.getElementById('playerCount').textContent = data.total_online || 0;

                const listEl = document.getElementById('matchesList');
                const rooms = data.rooms || [];

                if (rooms.length === 0) {
                    listEl.innerHTML = '<li style="color: #888;">No active matches right now</li>';
                } else {
                    listEl.innerHTML = rooms.map(r => {
                        const countText = `${r.player_count} ${r.player_count === 1 ? 'player' : 'players'}`;
                        return `<li><strong>${r.map || 'Unknown Map'}</strong> &mdash; ${r.mode || 'Match'} [${countText}]</li>`;
                    }).join('');
                }
            } catch (e) {
                const statusEl = document.getElementById('serverStatus');
                statusEl.textContent = 'Offline';
                statusEl.className = 'offline';
                document.getElementById('playerCount').textContent = '0';
                document.getElementById('matchesList').innerHTML = '<li style="color: #888;">Server unreachable</li>';
            }
        }

        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
